name: Deployment Prep
on:
  workflow_dispatch:
  push:
    branches:
      - master

jobs:
  config:
    if: github.repository == 'anuraghazra/github-readme-stats'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@e3a2bab67d1cc1d7ed11b3f74c3d910479635322 # v6.0.2
      - name: Deployment Prep
        run: python ./.github/workflows/deploy-prep.py
      - uses: stefanzweifel/git-auto-commit-action@457e6bf79f90c46f2e4c4e4b3b1c8b9d4a5c1e7f # v7.1.0
        with:
          branch: vercel
          create_branch: true
          push_options: "--force"
