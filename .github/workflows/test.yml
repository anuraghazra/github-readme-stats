name: Test
on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

permissions: read-all

jobs:
  build:
    name: Perform tests
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [22.x]

    steps:
      - uses: actions/checkout@e3a2bab67d1cc1d7ed11b3f74c3d910479635322 # v6.0.2

      - name: Setup Node
        uses: actions/setup-node@1a3f0a7b80daa9f4fb4ba65f50c5c9d2d53c9a7f # v6.2.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install & Test
        run: |
          npm ci
          npm run test

      - name: Run ESLint
        run: |
          npm run lint

      - name: Run bench tests
        run: |
          npm run bench

      - name: Run Prettier
        run: |
          npm run format:check

      - name: Code Coverage
        uses: codecov/codecov-action@1fa9c94fe3eddb5ba5c3f2a7d5f5a3e0c1db7a3f # v4.0.1
