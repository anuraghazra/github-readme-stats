name: Test Deployment
on:
  # Temporarily disabled automatic triggers; manual-only for now.
  workflow_dispatch:
  # Original trigger (restore to re-enable):
  # deployment_status:

permissions: read-all

jobs:
  e2eTests:
    # Temporarily disabled; set to the original condition to re-enable.
    # if:
    #   github.repository == 'anuraghazra/github-readme-stats' &&
    #   github.event_name == 'deployment_status' &&
    #   github.event.deployment_status.state == 'success'
    if: false
    name: Perform e2e tests
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [22.x]

    steps:
      - uses: actions/checkout@e3a2bab67d1cc1d7ed11b3f74c3d910479635322 # v6.0.2

      - name: Setup Node
        uses: actions/setup-node@1a3f0a7b80daa9f4fb4ba65f50c5c9d2d53c9a7f # v6.2.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci
        env:
          CI: true

      - name: Run end-to-end tests.
        run: npm run test:e2e
        # env:
        #   VERCEL_PREVIEW_URL: ${{ github.event.deployment_status.target_url }}
